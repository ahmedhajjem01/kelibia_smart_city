<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100" height="110">
  <!-- Base platform -->
  <rect x="10" y="92" width="80" height="5" rx="2" fill="#0d3a6e"/>

  <!-- Left building -->
  <polygon points="15,92 15,55 28,55 28,92" fill="#0d3a6e"/>

  <!-- Middle-left building -->
  <polygon points="28,92 28,42 42,42 42,92" fill="#1565c0"/>

  <!-- Center tall building -->
  <polygon points="38,92 38,20 55,20 55,92" fill="#1976d2"/>

  <!-- Center tall building highlight (glass panel left) -->
  <polygon points="38,20 44,16 44,88 38,92" fill="#42a5f5" opacity="0.7"/>

  <!-- Right-center building -->
  <polygon points="55,92 55,38 68,38 68,92" fill="#1565c0"/>

  <!-- Right tall panel (leaning glass) -->
  <polygon points="44,16 55,12 55,38 44,38" fill="#64b5f6" opacity="0.8"/>

  <!-- Far right building -->
  <polygon points="68,92 68,58 82,58 82,92" fill="#0d3a6e"/>

  <!-- Text: SMART CITY -->
  <text x="50" y="108" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0d3a6e" text-anchor="middle" letter-spacing="2">SMART CITY</text>
</svg>
